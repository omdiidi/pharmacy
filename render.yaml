# Render Blueprint for PharmaDash. One-click setup:
#   New → Blueprint → connect omdiidi/pharmacy → Apply.
# After Render reads this file, populate the `pharm1-shared` env group with
# secrets (see docs/render-setup.md). The worker stanza is intentionally
# commented out until the minicrew Linux port lands.

services:
  # --- Next.js web -----------------------------------------------------------
  - type: web
    name: pharm1-web
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run verify-models
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - fromGroup: pharm1-shared

  # --- minicrew worker (DISABLED until minicrew Linux port lands) ------------
  # When enabling: uncomment, ensure `npm run worker` is wired in package.json.
  # - type: worker
  #   name: pharm1-worker
  #   runtime: node
  #   plan: starter
  #   region: oregon
  #   buildCommand: npm ci && npm run build
  #   startCommand: npm run worker
  #   envVars:
  #     - fromGroup: pharm1-shared

  # --- Listing Agent (Phase 2 — daily cron, Layer 2) ------------------------
  # Reads watchlisted products and emits "list this on Amazon" briefings.
  # Stubbed: approval inserts pending_listings; real SP-API call lands later.
  - type: cron
    name: pharm1-listing-agent
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci
    schedule: "0 13 * * *"  # daily 13:00 UTC = 6am Pacific
    startCommand: npm run agent:listing
    envVars:
      - fromGroup: pharm1-shared

  # --- Bookkeeper (Phase 2 Wave 1 — daily P&L reconciliation) ---------------
  - type: cron
    name: pharm1-bookkeeper
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci
    schedule: "0 23 * * *"   # daily 23:00 UTC
    startCommand: npm run agent:bookkeeper
    envVars:
      - fromGroup: pharm1-shared

  # --- Portfolio Manager (Phase 2 Wave 1 — weekly strategic review) ---------
  - type: cron
    name: pharm1-portfolio-manager
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci
    schedule: "0 7 * * 0"    # Sundays 07:00 UTC
    startCommand: npm run agent:portfolio-manager
    envVars:
      - fromGroup: pharm1-shared

  # --- Reflector (Phase 2 Wave 1 — weekly distillation into memory) ---------
  # 30 min after Bookkeeper on Sunday to avoid claude_usage write race.
  - type: cron
    name: pharm1-reflector
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci
    schedule: "30 23 * * 0"  # Sundays 23:30 UTC
    startCommand: npm run agent:reflector
    envVars:
      - fromGroup: pharm1-shared

  # --- Repricer (Phase 2 Wave 2 — twice-daily reprice sweep) ----------------
  # Staggered 1h after pharm1-listing-agent (13:00 UTC) to avoid back-to-back
  # serial execution on Render's cron queue. Propose-only forever.
  - type: cron
    name: pharm1-repricer
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci
    schedule: "0 14,2 * * *"
    startCommand: npm run agent:repricer
    envVars:
      - fromGroup: pharm1-shared

  # --- Account Health (Phase 2 Wave 2 — daily 6am UTC; auto-pause on red) ---
  - type: cron
    name: pharm1-account-health
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci
    schedule: "0 6 * * *"
    startCommand: npm run agent:account-health
    envVars:
      - fromGroup: pharm1-shared

  # --- Weekly encrypted backup → Backblaze B2 --------------------------------
  - type: cron
    name: pharm1-backup-weekly
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile.backup
    schedule: "0 9 * * 0"  # Sundays 09:00 UTC
    dockerCommand: backup-supabase.sh
    envVars:
      - fromGroup: pharm1-shared

  # --- Monthly restore-test (proves backups are recoverable) -----------------
  - type: cron
    name: pharm1-backup-restore-test
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile.backup
    schedule: "0 10 1 * *"  # 1st of month, 10:00 UTC
    dockerCommand: restore-test.sh
    envVars:
      - fromGroup: pharm1-shared
      # Throwaway Supabase project used as the restore target.
      # Set this manually on the cron service — NOT in the shared group.
      - key: RESTORE_TEST_DB_URL
        sync: false

# ---------------------------------------------------------------------------
# Shared env vars. All values are `sync: false` so Render prompts the operator
# on first apply and stores them encrypted at rest.
# ---------------------------------------------------------------------------
envVarGroups:
  - name: pharm1-shared
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_APP_NAME
        value: "PharmaDash"
      - key: OPENROUTER_APP_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: ALLOWED_USER_EMAILS
        sync: false
      - key: BACKUP_PASSPHRASE
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_BUCKET
        sync: false
      - key: B2_ENDPOINT_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: MAX_DAILY_CLAUDE_SPEND_USD
        value: "50"
      # Demo-only: lets the password sign-in flow at /api/auth/dev-login
      # work in production. Single-user, gated by ALLOWED_USER_EMAILS +
      # DEV_PASSWORD. Set to "false" or remove for a real launch.
      - key: DEV_LOGIN_ENABLED
        value: "true"
      - key: NEXT_PUBLIC_DEV_LOGIN_ENABLED
        value: "true"
      # --- Wave 2: Amazon SP-API (cred-gated; agents fall back to fixtures when unset) ---
      - key: LWA_CLIENT_ID
        sync: false
      - key: LWA_CLIENT_SECRET
        sync: false
      - key: SP_API_REFRESH_TOKEN
        sync: false
      - key: SP_API_REGION
        value: "na"
      - key: SP_API_MARKETPLACE_ID
        value: "ATVPDKIKX0DER"
      - key: SP_API_SELLER_ID
        sync: false
      - key: SP_API_WEBHOOK_SECRET
        sync: false
      # --- Wave 2: Twilio SMS (Account Health red-alert; cred-gated) ---
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: KALEEM_SMS_NUMBER
        sync: false
